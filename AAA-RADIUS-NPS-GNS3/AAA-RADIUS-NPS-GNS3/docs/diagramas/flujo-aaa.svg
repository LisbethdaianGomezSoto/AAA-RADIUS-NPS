<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-label="Flujo de autenticación, autorización y accounting" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/><stop offset="1" stop-color="#150a2b"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1b2a4a" stroke-width="1" opacity="0.55"/>
    </pattern>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#00e5ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#39ff14" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ff2bd6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1100" height="580" fill="url(#bg)"/>
  <rect width="1100" height="580" fill="url(#grid)"/>
  <text x="550" y="36" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#00e5ff" letter-spacing="2">FLUJO AAA · INICIO DE SESIÓN POR CONSOLA</text>

  <!-- actores -->
  <g filter="url(#glow)" font-family="Consolas, 'Courier New', monospace" font-size="16" text-anchor="middle">
    <rect x="50" y="60" width="160" height="44" rx="10" fill="#0b0f1a" stroke="#ffd400" stroke-width="2.5"/>
    <text x="130" y="88" fill="#ffd400">Usuario</text>
    <rect x="310" y="60" width="180" height="44" rx="10" fill="#0b0f1a" stroke="#00e5ff" stroke-width="2.5"/>
    <text x="400" y="88" fill="#00e5ff">R1 / SW-1</text>
    <rect x="610" y="60" width="180" height="44" rx="10" fill="#0b0f1a" stroke="#ff2bd6" stroke-width="2.5"/>
    <text x="700" y="88" fill="#ff2bd6">NPS (RADIUS)</text>
    <rect x="890" y="60" width="180" height="44" rx="10" fill="#0b0f1a" stroke="#39ff14" stroke-width="2.5"/>
    <text x="980" y="88" fill="#39ff14">Active Directory</text>
  </g>
  <g stroke="#2b3b63" stroke-width="2" stroke-dasharray="6 6">
    <line x1="130" y1="104" x2="130" y2="550"/>
    <line x1="400" y1="104" x2="400" y2="550"/>
    <line x1="700" y1="104" x2="700" y2="550"/>
    <line x1="980" y1="104" x2="980" y2="550"/>
  </g>

  <g font-family="Consolas, 'Courier New', monospace" font-size="14" text-anchor="middle">
    <line x1="130" y1="160" x2="398" y2="160" stroke="#00e5ff" stroke-width="2" marker-end="url(#a1)"/>
    <text x="265" y="150" fill="#e6edf7">1 · login: user5 + clave</text>

    <line x1="400" y1="210" x2="698" y2="210" stroke="#ff2bd6" stroke-width="2" marker-end="url(#a3)"/>
    <text x="550" y="200" fill="#e6edf7">2 · Access-Request (PAP) 1812</text>

    <line x1="700" y1="260" x2="978" y2="260" stroke="#39ff14" stroke-width="2" marker-end="url(#a2)"/>
    <text x="840" y="250" fill="#e6edf7">3 · valida usuario y grupo</text>

    <line x1="978" y1="310" x2="702" y2="310" stroke="#39ff14" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a2)"/>
    <text x="840" y="300" fill="#e6edf7">4 · OK · miembro NIVEL-5</text>

    <line x1="698" y1="360" x2="402" y2="360" stroke="#ff2bd6" stroke-width="2" marker-end="url(#a3)"/>
    <text x="550" y="350" fill="#e6edf7">5 · Access-Accept + priv-lvl=5</text>

    <line x1="398" y1="410" x2="132" y2="410" stroke="#00e5ff" stroke-width="2" marker-end="url(#a1)"/>
    <text x="265" y="400" fill="#e6edf7">6 · prompt R1# (nivel 5)</text>

    <line x1="400" y1="460" x2="698" y2="460" stroke="#ff2bd6" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a3)"/>
    <text x="550" y="450" fill="#e6edf7">7 · Accounting Start/Stop 1813</text>
  </g>
  <g font-family="Consolas, 'Courier New', monospace" font-size="13" text-anchor="middle" filter="url(#glow)">
    <rect x="580" y="490" width="240" height="40" rx="8" fill="#0b0f1a" stroke="#ff2bd6" stroke-width="2"/>
    <text x="700" y="515" fill="#ff2bd6">8 · log IN*.log + evento 6272</text>
  </g>
  <text x="550" y="570" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#9fb3d9">si NPS no responde → se usa el usuario local (admin)</text>
</svg>
