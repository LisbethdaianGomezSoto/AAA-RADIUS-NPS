<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-label="Topología de la práctica AAA con RADIUS y NPS" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/><stop offset="1" stop-color="#150a2b"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1b2a4a" stroke-width="1" opacity="0.55"/>
    </pattern>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#ff2bd6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="900" height="600" fill="url(#bg)"/>
  <rect width="900" height="600" fill="url(#grid)"/>
  <text x="450" y="40" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#00e5ff" letter-spacing="2">TOPOLOGÍA · RED 10.7.1.0/24 · DOMINIO lab.local</text>

  <!-- enlaces físicos -->
  <g stroke="#9fb3d9" stroke-width="2.5" fill="none">
    <line x1="450" y1="160" x2="450" y2="250"/>
    <line x1="390" y1="330" x2="210" y2="430"/>
    <line x1="510" y1="330" x2="690" y2="430"/>
  </g>
  <g font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#9fb3d9">
    <text x="462" y="200">e0 ⇄ Gi0/0</text>
    <text x="262" y="372" text-anchor="middle">Gi0/1 ⇄ f0/0</text>
    <text x="640" y="372" text-anchor="middle">Gi0/2 ⇄ e0</text>
  </g>

  <!-- flujos RADIUS -->
  <g fill="none" stroke="#ff2bd6" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#arr)" filter="url(#glow)">
    <path d="M90 475 C 30 475, 30 115, 325 115"/>
    <path d="M560 290 C 700 290, 760 115, 575 115"/>
  </g>
  <g font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#ff2bd6">
    <text x="40" y="300" transform="rotate(-90 40 300)" text-anchor="middle">RADIUS UDP 1812/1813 · R1 → NPS</text>
    <text x="735" y="215">RADIUS · SW-1 → NPS</text>
  </g>

  <!-- nodos -->
  <g filter="url(#glow)">
    <rect x="330" y="70" width="240" height="90" rx="12" fill="#0b0f1a" stroke="#ff2bd6" stroke-width="3"/>
    <rect x="345" y="250" width="210" height="80" rx="12" fill="#0b0f1a" stroke="#00e5ff" stroke-width="3"/>
    <rect x="90" y="430" width="240" height="95" rx="12" fill="#0b0f1a" stroke="#39ff14" stroke-width="3"/>
    <rect x="570" y="430" width="240" height="95" rx="12" fill="#0b0f1a" stroke="#ffd400" stroke-width="3"/>
  </g>
  <g font-family="Consolas, 'Courier New', monospace" text-anchor="middle">
    <text x="450" y="98" font-size="18" font-weight="700" fill="#ff2bd6">Windows Server 2019</text>
    <text x="450" y="122" font-size="14" fill="#e6edf7">W-Server · AD DS + NPS</text>
    <text x="450" y="145" font-size="14" fill="#9fb3d9">10.7.1.10/24</text>

    <text x="450" y="280" font-size="18" font-weight="700" fill="#00e5ff">Switch SW-1</text>
    <text x="450" y="302" font-size="14" fill="#e6edf7">IOSv-L2 · VLAN 1</text>
    <text x="450" y="320" font-size="14" fill="#9fb3d9">10.7.1.2/24 (SVI)</text>

    <text x="210" y="460" font-size="18" font-weight="700" fill="#39ff14">Router R1</text>
    <text x="210" y="484" font-size="14" fill="#e6edf7">Cisco 2691 · IOS 12.4</text>
    <text x="210" y="507" font-size="14" fill="#9fb3d9">10.7.1.1/24 (f0/0)</text>

    <text x="690" y="460" font-size="18" font-weight="700" fill="#ffd400">PC administrador</text>
    <text x="690" y="484" font-size="14" fill="#e6edf7">WS0701-1 · cliente SSH</text>
    <text x="690" y="507" font-size="14" fill="#9fb3d9">10.7.1.20/24</text>
  </g>

  <!-- leyenda -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#9fb3d9">
    <line x1="260" y1="567" x2="300" y2="567" stroke="#9fb3d9" stroke-width="2.5"/>
    <text x="310" y="572">enlace físico</text>
    <line x1="460" y1="567" x2="500" y2="567" stroke="#ff2bd6" stroke-width="2.2" stroke-dasharray="8 6"/>
    <text x="510" y="572">flujo lógico RADIUS</text>
  </g>
</svg>
