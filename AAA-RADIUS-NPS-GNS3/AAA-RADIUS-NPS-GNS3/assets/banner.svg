<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="AAA RADIUS NPS - Laboratorio de seguridad en redes" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="1" stop-color="#150a2b"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.55" stop-color="#8a5cff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1b2a4a" stroke-width="1" opacity="0.6"/>
    </pattern>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect x="0" y="312" width="1200" height="8" fill="url(#neon)" filter="url(#glow)"/>

  <text x="60" y="62" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#ff2bd6" letter-spacing="3">// SEGURIDAD EN REDES · LABORATORIO</text>
  <text x="60" y="150" font-family="Consolas, 'Courier New', monospace" font-size="74" font-weight="700" fill="url(#neon)" filter="url(#glow)">AAA · RADIUS · NPS</text>
  <text x="60" y="198" font-family="Consolas, 'Courier New', monospace" font-size="26" fill="#00e5ff">Autenticación · Autorización · Accounting</text>
  <text x="60" y="244" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#9fb3d9">Windows Server (AD DS + NPS)  ×  Cisco IOS  ×  GNS3</text>
  <text x="60" y="282" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#39ff14">&gt; acceso por niveles 0 / 5 / 10  ·  SSH  ·  logs  ·  respaldo local</text>

  <!-- red decorativa -->
  <g stroke="#00e5ff" stroke-width="2" fill="none" opacity="0.9" filter="url(#glow)">
    <line x1="1040" y1="95" x2="1040" y2="170"/>
    <line x1="1040" y1="170" x2="960" y2="245"/>
    <line x1="1040" y1="170" x2="1120" y2="245"/>
  </g>
  <g filter="url(#glow)">
    <rect x="990" y="60" width="100" height="40" rx="8" fill="#0b0f1a" stroke="#ff2bd6" stroke-width="2.5"/>
    <text x="1040" y="85" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#ff2bd6">NPS · AD</text>
    <circle cx="1040" cy="170" r="24" fill="#0b0f1a" stroke="#00e5ff" stroke-width="2.5"/>
    <text x="1040" y="175" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#00e5ff">SW-1</text>
    <rect x="915" y="245" width="90" height="38" rx="8" fill="#0b0f1a" stroke="#39ff14" stroke-width="2.5"/>
    <text x="960" y="269" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#39ff14">R1</text>
    <rect x="1075" y="245" width="90" height="38" rx="8" fill="#0b0f1a" stroke="#ffd400" stroke-width="2.5"/>
    <text x="1120" y="269" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#ffd400">PC</text>
  </g>
</svg>
